services:
  app:
    build: .
    image: ai-integration:latest
    container_name: ai-integration-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    labels:
      com.ai-integration.project: ai-integration
      com.ai-integration.component: api
      com.ai-integration.owner: atarasov

  ollama:
    image: ollama/ollama:latest
    container_name: ai-integration-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    labels:
      com.ai-integration.project: ai-integration
      com.ai-integration.component: llm

volumes:
  ollama_data:
